# docker-compose.yml
services:
  edge:
    image: edge:latest
    container_name: edge-container
    network_mode: host
    privileged: true
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    #   - "/dev/ttyACM1:/dev/ttyACM1"
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all
    environment:
      # 应用变量：只有在 environment 段显式转发才会进入容器。
      # ⚠️ **不要**透传宿主 .env 的同名根目录变量：宿主值是宿主路径，容器里不是挂载点 →
      # 会写进容器可写层（宿主机看不到、容器重建即丢）。这里给**容器内**默认值：
      # 落在挂载卷内（= 宿主仓库里的对应子目录，持久），要换落点时用 *_IN_CONTAINER。
      - MOTRIX_EDGE_DIR=${MOTRIX_EDGE_DIR_IN_CONTAINER:-/root/workspace/motrix-edge}
      - MOTRIX_ROBOT_PIPELINE_DIR=${MOTRIX_ROBOT_PIPELINE_DIR_IN_CONTAINER:-/root/workspace/robot-pipeline/motrix-robot-pipeline}
      # 文件日志开关：与路径无关（两种运行方式语义相同）→ 照旧从 .env 透传；缺省必须显式给 0
      # （``file_log_enabled()`` 只认 0/false/no 为关，**空串会被判为开启**）。
      # 日志级别**不转发**（也没有环境变量）：容器内由 edge.yml / <robot>.yml 的 INFO_LEVEL 决定，
      # 不写 → 代码缺省 INFO。
      - MOTRIX_EDGE_LOG_FILE=${MOTRIX_EDGE_LOG_FILE:-0}
    volumes:
      - /run/udev:/run/udev:ro
      - /sys/bus/usb:/sys/bus/usb:ro
      - /dev:/dev:rw
      # 宿主目录挂到容器的 /root/workspace：缺省 . = 仓库根本身，容器内仓库即
      # /root/workspace（仓库路径 = /root/workspace/src）。**该布局必须与 .venv 的
      # editable 路径一致**（site-packages/motrix_edge.pth = <容器内仓库>/src），
      # 否则容器内 import motrix_edge 会失败——换布局后需重建 .venv（删除后重新 uv sync）。
      # 本机取值写进**不入库**的 .env（见仓库根 .env.example），避免个人绝对路径入库
      - ${MOTRIX_EDGE_WORKSPACE_DIR:-.}:/root/workspace:rw
    stdin_open: true
    tty: true
    command: "/bin/bash"
