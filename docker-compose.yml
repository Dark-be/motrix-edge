# docker-compose.yml
services:
  edge:
    image: edge:latest
    container_name: edge-container
    network_mode: host
    privileged: true
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    #   - "/dev/ttyACM1:/dev/ttyACM1"
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /run/udev:/run/udev:ro
      - /sys/bus/usb:/sys/bus/usb:ro
      - /dev:/dev:rw
      # 仓库根挂到容器的 /root/workspace。缺省 = 本文件所在目录的父目录（与旧行为一致）；
      # 本机路径写进**不入库**的 .env（MOTRIX_EDGE_DIR=/abs/path/to/motrix-edge），
      # 避免把个人绝对路径写进仓库
      - ${MOTRIX_EDGE_DIR:-..}:/root/workspace:rw
    stdin_open: true
    tty: true
    command: "/bin/bash"
