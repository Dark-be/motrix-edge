# 多频双 Piper：继承普通双 Piper 的机器人、服务与采集公共配置，只声明调度差异。
extends: dual_piper.yml
robot:
  depth:
    enabled: false
streams:
  enabled: true
  control_hz: 100
  follower_state_hz: 100
  max_joint_speed_rad_s: 3.141592653589793
  recording:
    queue_size: 512
    jpeg_quality: 90
  cameras:
    warmup_seconds: 3
    startup_timeout_seconds: 20
    max_consecutive_timeouts: 5
    profiles:
      cam_head: { width: 320, height: 240, stream_fps: 60, read_hz: 30 }
      cam_left_wrist: { width: 640, height: 480, stream_fps: 60, read_hz: 30 }
      cam_right_wrist: { width: 640, height: 480, stream_fps: 60, read_hz: 30 }
