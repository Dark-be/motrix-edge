# ⚠️ 本文件是**示例配置**（随包分发、只读、不含现场值）：实际运行配置在 <根>/config/——
#   <根> = $MOTRIX_ROBOT_PIPELINE_DIR，未设置时回落 <cwd>/motrix-robot-pipeline（配置 / 日志同一个根）：
#     · 整份机型配置：<根>/config/<本文件名>（首次访问把本示例**播种**过去，之后以它为准）
#     · 只写差异：    <根>/config/robot/<机器名>.yml（深合并到机型配置上）
#   生成 / 更新：bash scripts/setup_robot.sh（见 robot-pipeline/README.md「机器档案」）
INFO_LEVEL: INFO # DEBUG, INFO, ERROR

# 服务器监听地址（命令行 --host/--port 可覆盖）
server:
  host: 0.0.0.0
  port: 8090

# 机器人控制配置（单臂双 Piper：Leader 主臂 + Follower 从臂；硬件 SDK 仅在机器人端安装）
robot:
  name: single_piper_001
  type: single_piper_robot
  step_rad: 0.1 # 每帧最大关节增量（rad），env 控制线程限速接近 target
  init_joint: [0, 0, 0, 0, 0, 0] # 初始关节角（rad，6 关节）：joint 空间
  init_gripper: [1] # 初始夹爪开合（1 = 张开）：gripper 空间
  ports: # 控制器端口（CAN 接口名；**必填**，缺失 / 空串 → 启动报错）
    leader: can_right # Leader 主臂
    follower: can_left # Follower 从臂
  leader_firmware: v188 # Leader 主臂固件版本（default / v188 / v189；按实际固件调整）
  follower_firmware: v188 # Follower 从臂固件版本
  # 重力前馈（可选；见 wiki/design/robot_pipeline_impedance.md）：t_ff = α·τ̂_g(实测 q)
  # 未标定（占位全 0）或前馈降级时 t_ff = 0，行为与未补偿**完全一致**；
  # 标定完用 scripts/fit_gravity.py --install 覆盖该文件即自动生效（不用改这里）。
  gravity:
    enabled: true # 只装在执行臂（Follower）；主臂只读，不装载
    alpha: 1.0 # 前馈比例（0 = 不补偿）；首跑建议用 verify_gravity.py --hold --alpha 0.2 → 1.0 逐档验收
    t_ff_limit: 16.0 # 单关节前馈上限（N·m）：固件硬限幅 ±16，这里只能收紧
    params: gravity/piper_6dof.json # 参数文件（相对配置目录）；每臂一份用 arms.<臂名>.params

# 采集配置（env 在 capture start/end 之间把观测写成一条 episode）
collector:
  type: act_mcap # 采集器类型：act_mcap（act_hdf5 暂不可用）
  save_dir: ./data/single_piper # 采集数据保存目录
  image_format: jpeg # 图像编码：jpeg | raw（本机器人无相机，无实际图像数据）
