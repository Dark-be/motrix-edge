[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-edge"
version = "0.1.0"
description = "Robot edge node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",          # 数值计算
    "pyyaml",         # 配置文件解析
    "opencv-python-headless",  # 图像处理
    "websockets>=11.0",  # 推理客户端传输层
    "msgpack>=1.0.5",    # 推理客户端序列化
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "aiortc>=1.15.0",
    "httpx>=0.28.1",  # HTTP 客户端（adapter 中间件转发 SDK 指令）
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-cov",
    "ruff",
]

# 单一 src-layout 包 motrix_edge：随 uv sync 以 editable 方式安装，
# 并通过 console script `motrix-edge` 提供命令行入口。
[tool.uv]
package = true

[project.scripts]
motrix-edge = "motrix_edge.__main__:main"

# Robot Adapter 注册：entry point 名 = 适配器类型（adapter.type）。
# 外部 SDK / 包同样在此 group 下注册自己的 RobotAdapter，核心无需改动。
[project.entry-points."motrix_edge.adapters"]
test_robot = "motrix_edge.adapter.test_adapter:TestRobotAdapter"

[[tool.uv.index]]
name = "motphys"
url = "http://pypi.mp/simple"
