[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-edge"
version = "0.1.0"
description = "Robot edge node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",          # 数值计算
    "pyyaml",         # 配置文件解析
    "opencv-python-headless",  # 图像处理
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "httpx>=0.28.1",  # HTTP 客户端（adapter 中间件转发 SDK 指令）
    "prompt-toolkit>=3.0.53",  # 交互式 CLI（utils/cli.py）：行编辑 / 历史 / 补全
]

# 可选面：**按是否引入额外第三方依赖分组** —— 不引入额外依赖的客户端 / 服务不设选项
# （如 RPent 面只用 httpx + numpy，已在上面 dependencies 里，测试无需跳过）。
# 装法：``uv sync --extra <名>``（或 ``--extra all`` 一次装齐）；详见 README「安装」。
[project.optional-dependencies]
# openpi 策略客户端：WebSocket + msgpack 一问一答（transport/ws.py、policy/openpi/）
openpi = ["websockets>=11.0", "msgpack>=1.0.5"]
# lerobot-act 策略客户端：gRPC 流式（transport/grpc.py、policy/lerobot_act/）。
# 服务端动作载荷是 torch.Tensor，pickle 反序列化需 torch → 必须 `+cpu` 版本（官方 CPU
# wheel）避免拉入 CUDA / nvidia-* 依赖；官方源在国内很慢，下载源见文件末 [tool.uv] 的
# find-links（阿里云镜像）。
lerobot = ["grpcio>=1.62.0", "torch==2.9.1+cpu"]
# WebRTC 预览推流（server/webrtc.py）：aiortc 视频编码栈，可选面里最重的一个。
# 多相机独立 msid 依赖 RTCRtpSender._stream_id 私有字段（见 server/webrtc.py），
# 上限约束防升级静默失效。
webrtc = ["aiortc>=1.15.0,<2.0.0"]
# 一次装齐全部可选面（写法同 robot-pipeline 的 `camera`）
all = ["motrix-edge[openpi,lerobot,webrtc]"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-cov",
    "ruff",
    "grpcio-tools>=1.62.0",  # 重生成 vendored lerobot/transport 的 services_pb2{,_grpc}.py
    "protobuf>=4.25",
]

# 单一 src-layout 包 motrix_edge：随 uv sync 以 editable 方式安装，
# 并通过 console script `motrix-edge` 提供命令行入口。
[tool.uv]
package = true
# 依赖源：torch 官方源（download-r2.pytorch.org）在国内速度不理想——实测约 0.1 MB/s，
# wheel 175.9 MB 要下约 28 分钟（CI 上尤其明显）；改用阿里云 pytorch-wheels 镜像加速，
# 冷启动（空缓存 + 全新环境）实测约 10 秒。该镜像页是 flat 列表（无 PEP 503 子路径
# /torch/），故只能配 find-links，不能当 [[tool.uv.index]]。
# ⚠️ 代价：该页**不提供 `#sha256=` fragment**，uv 无法为它记录 wheel 哈希 → `uv.lock` 里 torch 的
# wheel **全部没有 hash**，`uv sync` 不校验镜像下发内容（**仅 torch 受此影响**：其余依赖走内网
# `pypi.mp` 索引，lock 里带 sha256）。取舍是「冷装 28 分钟 → 10 秒」换掉这一层校验：镜像与官方是
# 同 size + 同 mtime 的字节副本（2026-01-23 核对 `torch-2.9.1+cpu-cp310-cp310-manylinux_2_28_x86_64.whl`：
# 184425936 字节 / last-modified 一致），可信度依赖镜像本身不被篡改。
# 将来若想恢复校验：让内网 `pypi.mp` 代理 `download.pytorch.org/whl/cpu`（索引会发 hash，无需人工维护），
# 再从官方索引页把 sha256 补进 lock 即可。
find-links = ["https://mirrors.aliyun.com/pytorch-wheels/cpu/"]

[project.scripts]
motrix-edge = "motrix_edge.__main__:main"

# Robot Adapter 注册：entry point 名 = 适配器类型（adapter.type）。
# 外部 SDK / 包同样在此 group 下注册自己的 RobotAdapter，核心无需改动。
[project.entry-points."motrix_edge.adapters"]
test_robot = "motrix_edge.adapter.test_adapter:TestRobotAdapter"
dual_piper = "motrix_edge.adapter.dual_piper_adapter:DualPiperAdapter"

[[tool.uv.index]]
name = "motphys"
url = "http://pypi.mp/simple"
