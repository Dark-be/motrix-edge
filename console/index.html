<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Motrix Edge Console</title>
        <script>
            // 首帧前定主题（默认浅色）：避免深色用户看到浅色闪屏。
            try {
                if (localStorage.getItem("edge-console:theme") === "dark") {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {
                /* 隐私模式下 localStorage 不可用：保持浅色 */
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
