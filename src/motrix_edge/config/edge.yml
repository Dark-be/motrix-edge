# 包内默认配置（只读兜底）。外界配置：设置环境变量 MOTRIX_CONFIG_DIR 指向可写目录，
# 同名文件（edge.yml / capture.yml）优先于包内默认。
INFO_LEVEL: INFO # DEBUG, INFO, ERROR

# Edge 本地设备身份声明（引用，非权威；权威在 MotrixConsole）
identity:
  edge_id: edge-test-001
  edge_name: edge-test
  edge_version: "0.1.0"

# Edge 级租约配置（Console 权威：签发 / 续约 / 撤销租约镜像；Edge 只保留 + 校验）
lease:
  ttl: 120 # 租约默认有效期（秒）：Console 前端「签发租约」表单的缺省持续时间
  renew_interval: 60 # 建议续租间隔（秒）：Console 前端按此定时续租保持租约活跃

# MotrixEdge HTTP 服务监听配置（node 主线程内嵌的 web 线程使用）
server:
  host: 0.0.0.0
  port: 8000

# 本地采集 episode 扫描与上传队列；HTTP 扫描请求可覆盖 data_dir。
upload:
  data_dir: null
  endpoint: null # 远端上传服务尚未配置；upload 动作返回 501，不删除源文件

# 机器人适配器连接配置：Edge 向 adapter.host:adapter.port 发 POST /v1/discover
# 寻找机器人进程；进程启动后自描述返回 id / name / type / 能力 / 相机 / 控制器等。
# 启用臂 / 相机 / home_qpos 等能力配置**运行时**设置（命令 adapter config set 或前端
# POST /v1/adapters/config），不在此配置。
adapter:
  host: 127.0.0.1
  port: 8090

# 推理策略节点默认端点（见 wiki/design/motrix_edge_policy.md）。策略类型在进入
# 推理会话时由调用方显式选择；host / port 可运行时通过 infer ip / port 覆盖。
# 单臂任务：策略用通用 act（按启用臂数直通）；「哪条臂 / 怎么映射回 14 维」由 adapter 运行时配置承载。
policy:
  host: 127.0.0.1
  port: 8080
  type: act # 默认策略类型（会话显式选择时覆盖）
  # --- 策略配置项（**每个策略有自己的独立配置项**：prompt / 模型路径 / 设备 / 块长…）---
  # 声明见 policy.POLICY_CONFIG_ITEMS；查询 `infer config`，设置 `infer config set <json>`
  # 或 POST /v1/infers/config（会话内）/ POST /v1/infers body `config`（进入会话前）。
  # **运行时给定，不在此维护**：模型路径（act 的 pretrained_name_or_path，`infer model set`）
  # 与文本指令（openpi 的 prompt，`infer prompt`）由调用方 / 前端按所选策略动态填写。
  device: cuda # act：下发给服务端的推理设备（GPU 部署填 cuda / cuda:0）
  actions_per_chunk: 50 # act：动作块长 K（须匹配模型 chunk）
  # --- RTC（实时动作块管理：三元切分 + 时序平滑；见 wiki/design/motrix_edge_rtc.md）---
  # 策略只返回原始动作块（openpi/act 通用）；块缓存 / 切分 / 平滑 / 预取由 rtc 统一负责。
  # 运行期可经 `infer rtc`（查询）/ `infer rtc set <json>`（设置）或 POST /v1/infers/rtc 修改。
  rtc:
    enabled: true # 关闭 → 每步一次推理只取块首步（无块缓存 / 无平滑）
    action_horizon: 50 # 块长 H（信息性；缺省取策略 metadata / 客户端默认）
    execution_horizon: 30 # 实际执行段 E（步）；缺省 = H - suffix_len
    suffix_len: 20 # 过渡后缀 S（步）= 与下一块的重叠窗口；0 = 关闭平滑
    inference_delay: 0 # 前缀步数 D（信息性：预期块前部已失效的步数）
    aggregate_fn: weighted_average # 重叠聚合：weighted_average/latest_only/average/conservative
  # 其余策略参数（openpi 的 action_horizon/image_size/rename_cameras 等）
  # **一律用代码缺省值**，不在 yaml 维护；布局（单臂/双相机）由 adapter 运行时配置决定
  # 并自动传入策略（bind_adapter），openpi 侧无相机配置。
