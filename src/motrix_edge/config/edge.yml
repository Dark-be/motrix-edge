# 包内默认配置（只读）。现场覆盖文件：$MOTRIX_EDGE_DIR/config/edge.yml。
INFO_LEVEL: INFO # DEBUG, INFO, ERROR

# Edge 本地设备身份声明（引用，非权威；权威在 MotrixConsole）
identity:
  edge_id: edge-test-001
  edge_name: edge-test
  edge_version: "0.1.0"

# Edge 级租约配置（Console 权威：签发 / 续约 / 撤销租约镜像；Edge 只保留 + 校验）
lease:
  ttl: 120 # 租约默认有效期（秒）：Console 前端「签发租约」表单的缺省持续时间
  renew_interval: 60 # 建议续租间隔（秒）：Console 前端按此定时续租保持租约活跃

# MotrixEdge HTTP 服务监听配置（node 主线程内嵌的 web 线程使用）
server:
  host: 0.0.0.0
  port: 8000
  # RPent 兼容的 RPC 面（POST /call；见 wiki/design/motrix_edge_rpent_bridge.md）：
  # 外部 agent（LLM 当大脑 + 冻 VLA 当小脑，多轮工具调用）经它驱动 edge 执行原语。
  # 可选项**不在这里列全**（写了才生效；缺键取代码兜底 = rpent/service.py + rpent/settle.py）：
  #   lease_id（固定租约；缺省 = 当前活跃租约）/ step_hz（缺省 = 机器人上报的 control_hz）/
  #   action_layout（外部动作块布局，如 rpent/dual_franka）/ dry_run（只转换不下发）/
  #   image_source（native = 原图 | preview = 320x240 缓存）/ settle 的其余键（超时 / 停滞 / 轮询…）。
  #   object_position（多帧深度稳健估计：samples / min_samples / max_frames / timeout_s /
  #   outlier_m / mad_scale；缺省按 node.observe_interval 等新帧，参数见 env.get_env_meta 自描述）。
  # 下面只留**部署值**：容差按回执 final_err_m / final_err_rad 的**实测平台值**标定——容差小于
  # 残余静态误差时 reached 永远不成立（每个写原语都走满 stall_s / timeout_s）；当前取偏松的
  # 4cm / 0.4rad ≈ 23°（先把整定未完成的残余误差盖住），现场按平台值收敛后再收紧。标定见上述文档。
  rpent:
    settle:
      pos_tol: 0.04 # 位置容差（米）＝4cm：与姿态**分别**判定，不把米和弧度混进一个阈值
      rot_tol: 0.4 # 姿态 / 关节容差（弧度）≈23°：现场残余静态误差（含整定未完成部分）量级
      # 判到位后再多等一小段（秒）才回执：夹爪等量的**回读可能领先物理**（有些固件直接把下发值
      # 当反馈，误差一拍就是 0），此时「判到位」只证明命令生效、不证明动作做完，不等就会让
      # RPent 紧接着的 dump_state 拍到还没夹住的那一帧。只加在**判到位**这条路径上（超时 / 停滞
      # 不额外等）；逐次传 settle={"dwell_s": 0} 可关掉。缺键取 rpent/settle.py 的同值兜底。
      dwell_s: 0.5
    # 末端（工具）系三轴 ↔ 法兰哪根轴：**装配事实**，随 env.get_env_meta 回显给 agent。
    # 缺省（dual piper 真机实测）：forward=+z（工具伸出方向）/ left=+y / up=-x（法兰 +x 向下）。
    # 换机型 / 换支架后必须重验：`move_delta(delta_xyz=[0, 0, 0.02])` 只动 2 cm，看实际朝哪走。
    ego_axes: { forward: "+z", left: "+y", up: "-x" }

# 上传服务（UploadService，/v1/uploads/*；见 wiki/design/motrix_edge_upload.md）：
# 本地采集 episode 的扫描 / 查看 / 选择 / 打包。
# **本版本只做本地文件查看与打包**：临时性的数据查看与筛选由数采人员经前端进行，打包后
# 的文件由数采人员**手动上传**到数据平台；程序化上传（消费者为数据平台的上传 API）留待
# 后续版本，`endpoint` 即为其预留的远端服务地址。
upload:
  data_dir: null # 缺省扫描目录（null = 运行时回退 adapter 数据目录）
  endpoint: null # 数据平台上传服务地址（预留；未配置时 upload 动作返回 501，不删除源文件）

# 机器人适配器连接配置：Edge 向 adapter.host:adapter.port 发 POST /v1/discover
# 寻找机器人进程；进程启动后自描述返回 id / name / type / 能力 / 相机 / 控制器等。
# 启用臂 / 相机等能力配置**运行时**设置（命令 adapter config set 或前端
# POST /v1/adapters/config），不在此配置。
adapter:
  host: 127.0.0.1
  port: 8090

# 推理策略节点默认端点（见 wiki/design/motrix_edge_policy.md）。策略类型在进入
# 推理会话时由调用方显式选择；端点项 host / port / endpoint 是**会话级**策略配置项
# （进入会话时固化，改需退出重进），与 deployment / semantics 同一 schema、同一通道：
# infer config set / POST /v1/infers 的 config。
# **策略要连 TCP 端点**：openpi → ws（host/port）；lerobot-remote → zenoh（endpoint，缺省由
# host/port 拼成 tcp/host:port，默认端口 7447）。
# 单臂任务：策略用通用 lerobot-remote；「哪条臂 / 怎么映射回全臂维度」由 adapter 运行时配置承载。
policy:
  host: 127.0.0.1
  port: 8080 # openpi 的 ws 端口（lerobot-remote 走下面的 endpoint）
  endpoint: tcp/127.0.0.1:7447 # zenoh 端点（lerobot-remote）；留空则由 host/port 拼
  type: lerobot-remote # 默认策略类型（会话显式选择时覆盖）
  # --- 策略配置项（**每个策略有自己的独立配置项**：prompt / deployment / 块拼接…）---
  # 声明见 policy.POLICY_CONFIG_ITEMS；查询 `infer config`，设置 `infer config set <json>`
  # 或 POST /v1/infers/config（会话内）/ POST /v1/infers body `config`（进入会话前）。
  # **运行时给定，不在此维护**：远端部署名（lerobot-remote 的 deployment，`infer model set`）
  # 与文本指令（openpi 的 prompt，`infer config set`）由调用方 / 前端按所选策略动态填写。
  deployment: null # lerobot-remote：服务端 deployment 名（== server.yaml 的 deployment）
  semantics: null # lerobot-remote：动作单位/顺序标识，必须与服务端逐字一致
  mode: chunk # lerobot-remote：执行模式（块缓存/切分/预取由 edge RTC 负责）
  chunk_merge: append # lerobot-remote：块拼接语义（append | aligned，需服务端能力）
  encoding: raw # lerobot-remote：图像编码（raw | jpeg）
  observation_layout: qpos+qpos_err # state = concat(qpos, Robot 同帧提供的 qpos_err)
  action_layout: joint_delta # 模型输出叠加到 Robot 当前关节 target
  image_cameras: [cam_head, cam_right_wrist] # 只声明并上传 checkpoint 使用的两路图像
  # camera_map: # 可选：端上相机名 → 服务端特征名（缺省按短名后缀自动匹配，如 cam_head → ..._cam_head）
  #   cam_head: observation.images.piper_0_cam_head
  # --- RTC（实时动作块管理：异步预取 + 三元切分 + 过渡策略；见 wiki/design/motrix_edge_rtc.md）---
  # 策略只返回原始动作块（openpi / lerobot-remote 通用）；块缓存 / 切分 / 过渡 / 预取由 rtc 统一负责。
  # 预取在后台线程完成（控制环不阻塞）：推理期间走过的步会在返回时按步号自动跳过。
  # 运行期可经 `infer rtc`（查询）/ `infer rtc set <json>`（设置）或 POST /v1/infers/rtc 修改。
  rtc:
    enabled: true # 关闭 → 每步一次推理只取块首步（无块缓存 / 无过渡）
    action_horizon: 50 # 块长上限 H：一次推理只取策略块的前 H 步（如 10 = 10Hz × 1s 预测）
    prefix_len: 0 # 前置段 P：额外强制跳过的前 P 步（真实过期步自动跳过）；查 rtc.last_delay_steps 估算
    execution_horizon: 30 # 执行段 E：与上一块后缀重叠的步按过渡策略加权 + 未重叠部分直接执行（缺省 = H - P - S）；须 > P
    suffix_len: 20 # 后缀段 S（与下一块执行段的重叠窗口，同时是预取提前量）；须满足 P + S < H
    aggregate_fn: weighted_average # 过渡策略：weighted_average(0.3+0.7)/conservative(0.7+0.3)/average/latest_only/continuous(按步号 0→1)
  # 其余策略参数（openpi 的 action_horizon/image_size/rename_cameras 等）
  # **一律用代码缺省值**，不在 yaml 维护；布局（单臂/双相机）由 adapter 运行时配置决定
  # 并自动传入策略（bind_adapter），openpi 侧无相机配置。
