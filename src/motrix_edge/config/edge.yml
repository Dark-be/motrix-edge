# 包内默认配置（只读兜底）。外界配置：设置环境变量 MOTRIX_CONFIG_DIR 指向可写目录，
# 同名文件（edge.yml / capture.yml）优先于包内默认。
INFO_LEVEL: INFO # DEBUG, INFO, ERROR

# Edge 本地设备身份声明（引用，非权威；权威在 MotrixConsole）
identity:
  edge_id: edge-test-001
  edge_name: edge-test
  edge_version: "0.1.0"

# Edge 级租约配置（Console 权威：签发 / 续约 / 撤销租约镜像；Edge 只保留 + 校验）
lease:
  ttl: 120 # 租约默认有效期（秒）：Console 前端「签发租约」表单的缺省持续时间
  renew_interval: 60 # 建议续租间隔（秒）：Console 前端按此定时续租保持租约活跃

# MotrixEdge HTTP 服务监听配置（node 主线程内嵌的 web 线程使用）
server:
  host: 0.0.0.0
  port: 8000
  # RPent 兼容的 RPC 面（POST /call；见 wiki/design/motrix_edge_rpent_bridge.md）：
  # 外部 agent（LLM 当大脑 + 冻 VLA 当小脑，多轮工具调用）经它驱动 edge 执行原语。
  # RPent 不认 X-Lease-Id 头，故租约 id 由服务自行解析：
  #   lease_id: null → 用当前活跃租约（Console 签发后即有）；填值 → 固定用该租约。
  # 写方法与观测方法均须持有活跃租约；healthz / 能力自描述（get_env_meta / get_camera_meta）免租约。
  rpent:
    lease_id: null # 固定租约 id（null = 用当前活跃租约）
    step_hz: null # 动作块逐帧下发频率（null = 机器人上报的实测 control_hz）
    # 外部动作块布局（null = 要求块的维度与 adapter 的 action_dim 一致）。
    # rpent/dual_franka = 20 维 [L_xyz(3), L_rot6d(6), L_grip(1), R_xyz(3), R_rot6d(6), R_grip(1)]
    # → 转成 edge 每臂 [xyz, rpy, gripper] 笛卡尔绝对目标后再下发（rot6d → rpy，夹爪 ±1 → [0,1]）。
    action_layout: null
    # true = 只做转换并把结果回给调用方，**不下发**（真机联调先对数值，不动机器人）。
    dry_run: false
    # 观测图来源（RPent 会原样落盘 PNG 并内联给模型）：
    #   native  = 直读 adapter 原图（相机原生分辨率，小物体 / 夹爪间隙看得清；planner 面向）
    #   preview = 用 FrameManager 降采样缓存（320x240，省带宽）
    # 动作块的逐帧观测（面向 VLA、不喂 LLM）恒走缓存，不受此项影响。
    image_source: native
    # 到位等待（settle）：写原语下发后阻塞到「误差 ≤ 容差 / 超时 / 停滞」，回执带
    # reached / final_err（+ 分项 final_err_m / final_err_rad）/ elapsed_s / 生效容差等
    # ——外部 agent 靠它判成败，不等就会读到未动的那一帧。
    # ⚠️ 容差按 **MIT 实际稳态误差** 标定：底层只有 P/D、无重力 / 力矩前馈（t_ff = 0），
    #   关节会停在 τ_gravity / kp 附近的平衡点（实测平台值随姿态 / 负载变，可达 0.1–0.25 rad
    #   量级）→「设定什么关节就是什么关节」并不成立；容差小于稳态误差时 reached 永远不成立，
    #   每个写原语都会走满 stall_s / timeout_s（agent 侧看到「全是 stalled / timeout」）。
    #   **当前取值（位置 5cm / 姿态 0.4rad ≈ 23°）是有意放大的**：先把这个静态误差盖住，
    #   让 agent 判得出「到位」，而不是每次都等到超时；等底层补上重力 / 力矩前馈、或按现场实测
    #   （下发一个目标等它停稳，看回执 final_err / final_err_m / final_err_rad 的平台值）收敛后
    #   再把两个值一起收紧（只收紧一个 → 「到位」会总差在另一个上）。
    settle:
      enabled: true
      pos_tol: 0.05 # 位置容差（米）：与姿态**分别**判定，不把米和弧度混进一个阈值
      rot_tol: 0.4 # 姿态 / 关节容差（弧度）：≈23°，覆盖 MIT 静态误差（见上）
      timeout_s: 5.0 # 单次原语的等待上限（秒）
      max_timeout_s: 90.0 # 逐次覆盖 settle.timeout_s 的上限：客户端 HTTP 超时 120s，
      # 超了会把结构化回执变成客户端异常 → 宁可 edge 提前回 reached=false / timeout=true
      stall_s: 1.0 # 主误差多久没改善判 stalled（撞到东西 / 力不足；MIT 下也可能只是稳态误差平台）
      stall_eps: 1e-4 # 「有改善」的最小幅度：小于编码器噪声量级时误差会一直显得在改善 →
      # 判不出 stalled、一路等到 timeout；现场看到这个现象就把它调到噪声量级以上
      poll_s: 0.02 # 轮询间隔（秒）
      target_wait_s: 1.0 # 位姿增量（move_delta / rotate_delta）下发后等「命令落地」的上限（秒）：
      # 观测里的 observations/pose_target 从下发前快照跃迁即视为落地（下发走命令队列 + 观测按观察
      # 频率发布，不等就会拿旧目标当参考而误判到位）；一直未跃迁 → reached: null + not_applied

# 上传会话（UploadSession，/v1/uploads/*；见 wiki/design/motrix_edge_upload_session.md）：
# 本地采集 episode 的扫描 / 查看 / 选择 / 打包。
# **本版本只做本地文件查看与打包**：临时性的数据查看与筛选由数采人员经前端进行，打包后
# 的文件由数采人员**手动上传**到数据平台；程序化上传（消费者为数据平台的上传 API）留待
# 后续版本，`endpoint` 即为其预留的远端服务地址。
upload:
  data_dir: null # 缺省扫描目录（null = 运行时回退 adapter 数据目录）
  endpoint: null # 数据平台上传服务地址（预留；未配置时 upload 动作返回 501，不删除源文件）

# 机器人适配器连接配置：Edge 向 adapter.host:adapter.port 发 POST /v1/discover
# 寻找机器人进程；进程启动后自描述返回 id / name / type / 能力 / 相机 / 控制器等。
# 启用臂 / 相机等能力配置**运行时**设置（命令 adapter config set 或前端
# POST /v1/adapters/config），不在此配置。
adapter:
  host: 127.0.0.1
  port: 8090

# 推理策略节点默认端点（见 wiki/design/motrix_edge_policy.md）。策略类型在进入
# 推理会话时由调用方显式选择；host / port 是**会话级**策略配置项（进入会话时固化，改需退出重进），
# 与 prompt / 模型路径同一 schema、同一通道：infer config set / POST /v1/infers 的 config。
# **策略要连 TCP 端点**（openpi → ws、lerobot-act → gRPC）；host / port 排在其配置项清单最前，
# 单臂任务：策略用通用 lerobot-act（按启用臂数直通）；「哪条臂 / 怎么映射回全臂维度」由 adapter 运行时配置承载。
policy:
  host: 127.0.0.1
  port: 8080
  type: lerobot-act # 默认策略类型（会话显式选择时覆盖）
  # --- 策略配置项（**每个策略有自己的独立配置项**：prompt / 模型路径 / 设备 / 块长…）---
  # 声明见 policy.POLICY_CONFIG_ITEMS；查询 `infer config`，设置 `infer config set <json>`
  # 或 POST /v1/infers/config（会话内）/ POST /v1/infers body `config`（进入会话前）。
  # **运行时给定，不在此维护**：模型路径（lerobot-act 的 pretrained_name_or_path，`infer model set`）
  # 与文本指令（openpi 的 prompt，`infer prompt`）由调用方 / 前端按所选策略动态填写。
  device: cuda # lerobot-act：下发给服务端的推理设备（GPU 部署填 cuda / cuda:0）
  actions_per_chunk: 50 # lerobot-act：动作块长 K（须匹配模型 chunk）
  # --- RTC（实时动作块管理：异步预取 + 三元切分 + 过渡策略；见 wiki/design/motrix_edge_rtc.md）---
  # 策略只返回原始动作块（openpi/lerobot-act 通用）；块缓存 / 切分 / 过渡 / 预取由 rtc 统一负责。
  # 预取在后台线程完成（控制环不阻塞）：推理期间走过的步会在返回时按步号自动跳过。
  # 运行期可经 `infer rtc`（查询）/ `infer rtc set <json>`（设置）或 POST /v1/infers/rtc 修改。
  rtc:
    enabled: true # 关闭 → 每步一次推理只取块首步（无块缓存 / 无过渡）
    action_horizon: 50 # 块长上限 H：一次推理只取策略块的前 H 步（如 10 = 10Hz × 1s 预测）
    prefix_len: 0 # 前置段 P：额外强制跳过的前 P 步（真实过期步自动跳过）；查 rtc.last_delay_steps 估算
    execution_horizon: 30 # 执行段 E：与上一块后缀重叠的步按过渡策略加权 + 未重叠部分直接执行（缺省 = H - P - S）；须 > P
    suffix_len: 20 # 后缀段 S（与下一块执行段的重叠窗口，同时是预取提前量）；须满足 P + S < H
    aggregate_fn: weighted_average # 过渡策略：weighted_average(0.3+0.7)/conservative(0.7+0.3)/average/latest_only/continuous(按步号 0→1)
  # 其余策略参数（openpi 的 action_horizon/image_size/rename_cameras 等）
  # **一律用代码缺省值**，不在 yaml 维护；布局（单臂/双相机）由 adapter 运行时配置决定
  # 并自动传入策略（bind_adapter），openpi 侧无相机配置。
