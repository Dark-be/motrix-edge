INFO_LEVEL: INFO # DEBUG, INFO, ERROR

# 机器人进程发现：Edge 向固定端口发 POST /v1/discover 寻找机器人进程；进程启动后
# 自描述返回 id / name / type / 能力 / 相机 / 控制器等（见 wiki/design/motrix_edge_adapter.md）
discover:
  host: 127.0.0.1
  port: 8090

# 推理策略客户端（见 wiki/design/motrix_edge_policy.md）：host / port 可在运行期经
# infer ip / infer ip set / infer port / infer port set 命令覆盖（内存态，下次
# session run infer 生效）；test_infer_point.py 为无真实推理的虚拟 openpi 端点。
policy:
  host: 0.0.0.0 # 推理节点地址（前端推理卡片可运行时设置）
  port: 8765 # 推理节点端口（前端推理卡片可运行时设置）
  # act7dof（ACT7DofClient）策略参数：qpos 从观测按索引挑选、相机从观测键挑选
  type: act7dof # 默认策略类型（注册表键；会话显式选择时覆盖）
  qpos_dim: 7 # ACT 模型输入 qpos 维度
  qpos_indices: [7, 8, 9, 10, 11, 12, 13] # 从 14 维观测取右臂（按需修改）
  cameras: [cam_head, cam_right_wrist] # 从 adapter 观测键挑选（按需修改）
  action_indices: [7, 8, 9, 10, 11, 12, 13] # 模型 action 填充回 14 维（右臂）
  action_fill: [0, 0, 0, 0, 0, 0, 0] # 左臂 home 位姿（未覆盖维度填充；按需修改）
