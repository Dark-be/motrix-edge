[pytest]
testpaths =
    tests
    robot-pipeline/tests
pythonpath =
    src
    robot-pipeline/src
    tests
    robot-pipeline/tests
addopts =
    --import-mode=importlib
    --cov=src/motrix_edge
    --cov=robot-pipeline/src
    --cov-config=.coveragerc
    --cov-report term
    --cov-report xml:py-coverage.xml
    --junitxml=py-report.xml
timeout = 30
